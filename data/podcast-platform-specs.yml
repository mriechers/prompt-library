# Podcast platform specs — the ONE file to edit when a limit changes.
#
# Consumed by scripts/render_platform_specs.py, which renders these records into:
#   - prompts/podcast-distribution-copywriter.md  (between the PLATFORM SPECS markers)
#   - docs/podcast-platform-specs.md               (standalone reference, for project knowledge)
# Both outputs are generated. Never edit them by hand: edit here, then run
#   python3 scripts/render_platform_specs.py
# CI runs the same script with --check and fails if either output has drifted.
#
# FORMAT — a deliberately small subset of YAML, so the renderer needs no PyYAML:
#   - A top-level list of flat records. Each record starts with "- id: ...".
#   - One "key: value" per line. No nesting, no lists, no multi-line values.
#   - Quote a value with "double quotes" if it contains ": " (colon-space).
#   - Comments are whole lines starting with #. No inline comments, so a # inside
#     a URL is safe.
# The renderer validates every record and exits loudly on anything outside this subset.
#
# FIELDS
#   id        unique, dotted: <platform>.<field>
#   group     directories | rss | hosts | social | web — sets which table it lands in
#   platform  display name
#   field     what the value applies to
#   value     the limit or behavior, written for a copywriter
#   status    documented  — the platform's own docs (or the governing spec) state it
#             secondary   — hosts, third-party testing, or trade press; the platform is silent
#             convention  — copywriting/SEO practice with no platform authority
#             unverified  — no reliable source found; do not present as fact
#   source    URL of the best source (optional for convention)
#   verified  YYYY-MM-DD — the date a person or agent last checked the source
#   note      optional; the caveat a copywriter most needs
#
# UPDATING A SPEC: change value (and source if it moved), set verified to today,
# re-run the renderer, and add a line to the CHANGELOG saying what changed and why.

# ---------------------------------------------------------------------------
# Podcast directories
# ---------------------------------------------------------------------------

- id: apple.show_description
  group: directories
  platform: Apple Podcasts
  field: Show description
  value: 4,000 characters
  status: documented
  source: https://podcasters.apple.com/support/1236-subscription-best-practices
  verified: 2026-09-20
  note: For RSS-delivered shows. Apple's RSS requirements page itself states no limit; hosts enforce 4,000.

- id: apple.episode_description
  group: directories
  platform: Apple Podcasts
  field: Episode description
  value: 4,000 characters
  status: documented
  source: https://podcasters.apple.com/support/1236-subscription-best-practices
  verified: 2026-09-20
  note: Episodes authored directly in Podcasts Connect allow 10,000. RSS-delivered episodes use 4,000.

- id: apple.episode_title
  group: directories
  platform: Apple Podcasts
  field: Episode title
  value: No documented limit for RSS; 150 characters in Podcasts Connect
  status: documented
  source: https://podcasters.apple.com/support/825-how-to-create-an-episode
  verified: 2026-09-20

- id: apple.rss_precedence
  group: directories
  platform: Apple Podcasts
  field: Edits vs. RSS
  value: RSS metadata overrides anything entered in Podcasts Connect
  status: documented
  source: https://podcasters.apple.com/support/832-podcast-metadata
  verified: 2026-09-20
  note: Fix copy at the host, never in Connect.

- id: apple.html
  group: directories
  platform: Apple Podcasts
  field: Show-notes formatting
  value: Paragraphs render; bold and italic do not; link and list support varies by app version
  status: secondary
  source: https://transistor.fm/rendering/
  verified: 2026-09-20
  note: Sources disagree on links and lists. Write notes that still read well as plain text.

- id: spotify.description
  group: directories
  platform: Spotify
  field: Show and episode description
  value: No documented limit; provider support cites 60,000 characters
  status: documented
  source: https://providersupport.spotify.com/article/incorrect-show-description-on-client
  verified: 2026-09-20
  note: The long-repeated 500-character limit is not current. Spotify truncates for display by device.

- id: spotify.tags
  group: directories
  platform: Spotify
  field: Description tags read
  value: "description, media:description, content:encoded — not itunes:summary"
  status: documented
  source: https://support.spotify.com/us/creators/article/podcast-specification-doc/
  verified: 2026-09-20
  note: Podcast Delivery Specification v1.10, May 2025.

- id: spotify.html
  group: directories
  platform: Spotify
  field: Show-notes formatting
  value: "Supports p, br, a (HTTPS links only), h1, h2, ul, ol, li"
  status: documented
  source: https://support.spotify.com/us/creators/article/formatting-your-show-notes/
  verified: 2026-09-20
  note: Bold and italic are not on the list.

- id: spotify.rss_precedence
  group: directories
  platform: Spotify
  field: Edits vs. RSS
  value: Show and episode text comes from RSS; changes propagate within about 24 hours
  status: documented
  source: https://support.spotify.com/us/creators/article/your-rss-feed/
  verified: 2026-09-20
  note: Spotify has no short-description field of its own. See Libsyn for a host-side override.

- id: youtube.description
  group: directories
  platform: YouTube / YouTube Music
  field: Show and episode description
  value: 5,000 characters
  status: documented
  source: https://support.google.com/youtube/answer/12948449
  verified: 2026-09-20

- id: youtube.rss_precedence
  group: directories
  platform: YouTube / YouTube Music
  field: Edits vs. RSS
  value: A Studio edit to an episode blocks all future RSS updates to that episode; show details never auto-update from RSS
  status: documented
  source: https://support.google.com/youtube/answer/13973017
  verified: 2026-09-20
  note: The one major exception to 'RSS wins'. Audit YouTube copy separately from the feed.

- id: youtube.html
  group: directories
  platform: YouTube / YouTube Music
  field: Show-notes formatting
  value: "No HTML; '<' and '>' rejected; links display as plain-text URLs"
  status: documented
  source: https://support.google.com/youtubemusic/answer/13525207
  verified: 2026-09-20

- id: youtube.rss_status
  group: directories
  platform: YouTube / YouTube Music
  field: RSS ingestion
  value: Active, in select countries and regions
  status: documented
  source: https://support.google.com/youtubemusic/answer/13525207
  verified: 2026-09-20
  note: Google Podcasts shut down in 2024 and moved listeners here. That shutdown did not affect YouTube's RSS program.

- id: amazon.description
  group: directories
  platform: Amazon Music / Audible
  field: Show and episode description
  value: No public limit documented
  status: unverified
  source: https://podcasters.amazon.com/frequently-asked-questions
  verified: 2026-09-20
  note: The 4,000 figure in circulation appears copied from Apple. Staying under 4,000 is the safe choice.

- id: amazon.html
  group: directories
  platform: Amazon Music / Audible
  field: Show-notes formatting
  value: Reported to display plain text with URLs auto-linked
  status: secondary
  source: https://podnews.net/article/amazon-music-podcasts
  verified: 2026-09-20
  note: Report dates from 2020. Wondery was dissolved into Audible in 2025.

- id: rss_clients.description
  group: directories
  platform: Pocket Casts, Overcast, Castro
  field: Show and episode description
  value: No documented limit; these apps render what the feed sends
  status: unverified
  source: https://support.pocketcasts.com/knowledge-base/podcast-parsing/
  verified: 2026-09-20

- id: rss_clients.html
  group: directories
  platform: Pocket Casts, Overcast
  field: Show-notes formatting
  value: Bold, italic, tables and images render
  status: secondary
  source: https://transistor.fm/rendering/
  verified: 2026-09-20
  note: The richest rendering of the major apps. Don't write for it, since the big three strip it.

- id: castro.status
  group: directories
  platform: Castro
  field: Platform status
  value: Nearly shut down in late 2023; sold to Bluck Apps in January 2024
  status: secondary
  source: https://9to5mac.com/2024/01/31/podcast-app-castro-saved/
  verified: 2026-09-20
  note: Confirm it's still maintained before treating it as a priority platform.

- id: all.preview
  group: directories
  platform: All podcast apps
  field: Visible preview before truncation
  value: Not documented by any platform
  status: unverified
  verified: 2026-09-20
  note: Depends on screen width, text size, font and app version. Treat any specific number as a guess.

- id: all.episode_title
  group: directories
  platform: All podcast apps
  field: Episode title length
  value: Keep the distinctive part within the first ~60 characters
  status: convention
  verified: 2026-09-20
  note: No platform sets 60. Apps and widgets truncate unpredictably.

# ---------------------------------------------------------------------------
# RSS feed specs
# ---------------------------------------------------------------------------

- id: rss.description
  group: rss
  platform: RSS (PSP-1 spec)
  field: "<description>, channel and item"
  value: 4,000 bytes
  status: documented
  source: https://github.com/Podcast-Standards-Project/PSP-1-Podcast-RSS-Specification
  verified: 2026-09-20
  note: Bytes, not characters. Curly quotes, dashes, accented letters and emoji take 2-4 bytes each.

- id: rss.itunes_summary
  group: rss
  platform: RSS (legacy Apple tags)
  field: "<itunes:summary>"
  value: 4,000 characters
  status: secondary
  source: https://github.com/simplepie/simplepie-ng/wiki/Spec:-iTunes-Podcast-RSS
  verified: 2026-09-20
  note: Apple no longer publishes this tag reference. Spotify ignores this tag.

- id: rss.html_counts
  group: rss
  platform: RSS (all hosts)
  field: HTML in descriptions
  value: Tags and full link URLs count toward the limit
  status: secondary
  source: https://help.rss.com/en/support/solutions/articles/44002278172-understanding-the-4000-character-limit-for-podcast-and-episode-notes
  verified: 2026-09-20
  note: "Safe set across the big apps: <p>, <a href> with HTTPS, <ul>/<li>."

