# ---------------------------------------------------------------------------
# Web and CMS
# ---------------------------------------------------------------------------

- id: web.page_title
  group: web
  platform: Search (Google)
  field: Page title
  value: 50-60 characters
  status: convention
  verified: 2026-09-20
  note: Google truncates by pixel width, not character count.

- id: web.meta_description
  group: web
  platform: Search (Google)
  field: Meta description
  value: 150-160 characters
  status: convention
  verified: 2026-09-20
  note: Google often rewrites snippets anyway. Write it as a real summary, not a keyword list.

- id: web.excerpt
  group: web
  platform: CMS
  field: Excerpt or summary
  value: 150-300 characters
  status: convention
  verified: 2026-09-20
  note: Shown on archive pages, in social share cards and in RSS.
