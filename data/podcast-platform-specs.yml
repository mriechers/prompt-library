- id: buzzsprout.episode_description
  group: hosts
  platform: Buzzsprout
  field: Episode description
  value: 4,000 characters, including hidden link and HTML characters
  status: documented
  source: https://www.buzzsprout.com/help/179-footer
  verified: 2026-09-20
  note: Anything over the limit is truncated. The episode footer is a separate 500-character field.

- id: captivate.show_description
  group: hosts
  platform: Captivate
  field: Show description
  value: 4,000 characters
  status: documented
  source: https://help.captivate.fm/en/articles/3020421-podcast-settings-overview
  verified: 2026-09-20

- id: libsyn.episode_description
  group: hosts
  platform: Libsyn
  field: Episode description
  value: 4,000 characters
  status: documented
  source: https://five.libsynsupport.com/hc/en-us/articles/4402566930829-About-Your-Episode-Details
  verified: 2026-09-20

- id: libsyn.destination_override
  group: hosts
  platform: Libsyn
  field: Per-destination override
  value: Separate title, author and description per destination (e.g. Spotify), delivered as its own feed
  status: documented
  source: https://help.libsynsupport.com/hc/en-us/articles/360040796072-Spotify
  verified: 2026-09-20
  note: The only host found that offers this.

- id: rsscom.descriptions
  group: hosts
  platform: RSS.com
  field: Show and episode description
  value: 4,000 characters
  status: documented
  source: https://help.rss.com/en/support/solutions/articles/44002278172-understanding-the-4000-character-limit-for-podcast-and-episode-notes
  verified: 2026-09-20

- id: podbean.show_description
  group: hosts
  platform: Podbean
  field: Show description
  value: 50,000 characters
  status: documented
  source: https://help.podbean.com/support/solutions/articles/25000005101-podcast-basic-settings
  verified: 2026-09-20
  note: Podbean accepts far more than Apple will display. Keep it under 4,000.

- id: transistor.summary
  group: hosts
  platform: Transistor
  field: Episode summary
  value: Field removed February 2023; full show notes only
  status: documented
  source: https://transistor.fm/changelog/episode-summaries-removed/
  verified: 2026-09-20

- id: simplecast.summary
  group: hosts
  platform: Simplecast
  field: Episode summary
  value: No documented limit; plain text only
  status: documented
  source: https://help.simplecast.com/hc/en-us/articles/21953684815901-Create-and-Publish-a-New-Episode-in-Simplecast
  verified: 2026-09-20

- id: spotify_creators.status
  group: hosts
  platform: Spotify for Creators
  field: Platform status
  value: Replaced Anchor and Spotify for Podcasters; unmigrated legacy content deleted April 17, 2026
  status: secondary
  source: https://ppc.land/spotify-warns-podcast-creators-anchor-and-legacy-accounts-face-april-17-deletion/
  verified: 2026-09-20

